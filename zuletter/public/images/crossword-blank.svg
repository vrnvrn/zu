<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#ffffff"/>
  
  <!-- Grid lines -->
  <g stroke="#000000" stroke-width="1">
    <!-- Vertical lines -->
    <line x1="40" y1="40" x2="40" y2="360"/>
    <line x1="80" y1="40" x2="80" y2="360"/>
    <line x1="120" y1="40" x2="120" y2="360"/>
    <line x1="160" y1="40" x2="160" y2="360"/>
    <line x1="200" y1="40" x2="200" y2="360"/>
    <line x1="240" y1="40" x2="240" y2="360"/>
    <line x1="280" y1="40" x2="280" y2="360"/>
    <line x1="320" y1="40" x2="320" y2="360"/>
    <line x1="360" y1="40" x2="360" y2="360"/>
    
    <!-- Horizontal lines -->
    <line x1="40" y1="40" x2="360" y2="40"/>
    <line x1="40" y1="80" x2="360" y2="80"/>
    <line x1="40" y1="120" x2="360" y2="120"/>
    <line x1="40" y1="160" x2="360" y2="160"/>
    <line x1="40" y1="200" x2="360" y2="200"/>
    <line x1="40" y1="240" x2="360" y2="240"/>
    <line x1="40" y1="280" x2="360" y2="280"/>
    <line x1="40" y1="320" x2="360" y2="320"/>
    <line x1="40" y1="360" x2="360" y2="360"/>
  </g>
  
  <!-- Black squares (typical crossword pattern) -->
  <g fill="#000000">
    <rect x="40" y="40" width="40" height="40"/>
    <rect x="200" y="40" width="40" height="40"/>
    <rect x="320" y="40" width="40" height="40"/>
    
    <rect x="120" y="80" width="40" height="40"/>
    <rect x="280" y="80" width="40" height="40"/>
    
    <rect x="40" y="120" width="40" height="40"/>
    <rect x="160" y="120" width="40" height="40"/>
    <rect x="240" y="120" width="40" height="40"/>
    
    <rect x="80" y="160" width="40" height="40"/>
    <rect x="200" y="160" width="40" height="40"/>
    <rect x="320" y="160" width="40" height="40"/>
    
    <rect x="40" y="200" width="40" height="40"/>
    <rect x="160" y="200" width="40" height="40"/>
    <rect x="280" y="200" width="40" height="40"/>
    
    <rect x="120" y="240" width="40" height="40"/>
    <rect x="240" y="240" width="40" height="40"/>
    <rect x="320" y="240" width="40" height="40"/>
    
    <rect x="40" y="280" width="40" height="40"/>
    <rect x="160" y="280" width="40" height="40"/>
    
    <rect x="80" y="320" width="40" height="40"/>
    <rect x="200" y="320" width="40" height="40"/>
    <rect x="320" y="320" width="40" height="40"/>
  </g>
  
  <!-- Small numbers in corners of some cells -->
  <g font-family="Inter, sans-serif" font-size="10" fill="#000000">
    <text x="85" y="52">1</text>
    <text x="125" y="52">2</text>
    <text x="245" y="52">3</text>
    <text x="285" y="52">4</text>
    
    <text x="45" y="92">5</text>
    <text x="165" y="92">6</text>
    <text x="205" y="92">7</text>
    
    <text x="85" y="132">8</text>
    <text x="285" y="132">9</text>
    
    <text x="125" y="172">10</text>
    <text x="245" y="172">11</text>
    
    <text x="85" y="212">12</text>
    <text x="205" y="212">13</text>
    
    <text x="45" y="252">14</text>
    <text x="165" y="252">15</text>
    
    <text x="85" y="292">16</text>
    <text x="205" y="292">17</text>
    
    <text x="45" y="332">18</text>
    <text x="125" y="332">19</text>
    <text x="245" y="332">20</text>
  </g>
  
  <!-- Border -->
  <rect x="40" y="40" width="320" height="320" stroke="#000000" stroke-width="2" fill="none"/>
</svg>
